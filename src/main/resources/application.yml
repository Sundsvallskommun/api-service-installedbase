dept44:
  rabbitmq:
    enabled: true
integration:
  datawarehousereader:
    connectTimeout: 5
    readTimeout: 110
  rabbitmq:
    # The service's own exchange, on which it publishes delegation events
    exchange: api-fabriken.installedbase
logging:
  level:
    root: INFO
openapi:
  name: ${spring.application.name}
  title: ${spring.application.name}
  version: '@project.version@'
resilience4j:
  circuitbreaker:
    instances:
      datawarehousereader:
        ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
spring:
  application:
    name: api-installedbase
  jpa:
    hibernate:
      ddl-auto: validate
  rabbitmq:
    virtual-host: api-fabriken
  security:
    oauth2:
      client:
        registration:
          datawarehousereader:
            authorization-grant-type: client_credentials
            provider: datawarehousereader
springdoc:
  swagger-ui:
    operationsSorter: method
# Prevent duplicate code on setters & getters in sonarcloud 
sonar:
  cpd:
    exclusions: '**/api/model/**'
