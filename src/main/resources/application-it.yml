integration:
  datawarehousereader:
    connectTimeout: 5
    readTimeout: 20
    url: http://localhost:${wiremock.server.port}/datawarehousereaderMock
spring:
  datasource:
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    url: jdbc:tc:mariadb:10.6.14:///
  flyway:
    enabled: true
  rabbitmq:
    # No broker in the integration tests: a delegation event fails to publish and is logged, as a failed call to
    # eventlog was before. Nothing listens on port 1, so it fails at once.
    port: 1
  security:
    oauth2:
      client:
        provider:
          datawarehousereader:
            token-uri: http://localhost:${wiremock.server.port:}/gatewayMock
        registration:
          datawarehousereader:
            client-id: the-client-id
            client-secret: the-client-secret
